version: '3.8'

services:
  # -------------------- FRONTEND (Next.js) --------------------
  frontend:
    image: facc1/front_next:latest 
    container_name: frontend
    restart: always
    ports:
      - "80:3000"
    depends_on:
      - backend















  backend:
    # 🎯 No se requiere cambio aquí si el backend sigue siendo FastAPI.
    image: facc1/backend_fastapi:latest
    container_name: backend
    restart: always
    environment:
      - FRONTEND_URL=http://<IP_PUBLICA_VM> 
    ports:
      - "8000:8000"
      
networks:
  default: