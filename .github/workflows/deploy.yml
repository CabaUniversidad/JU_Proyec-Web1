name: 🚀 Despliegue Automático a Render

on:
  push:
    branches:
      - developer

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/nextapp:latest

jobs:

  # ================================
  #   Job 1: Build + Push Docker
  # ================================
  build-and-push:
    name: 🛠️ Construir y Publicar Imagen Docker
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: ⚙️ Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Construir y Publicar Imagen Next.js
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}

    outputs:
      image_tag: ${{ env.IMAGE_NAME }}

  # ================================
  #   Job 2: Notificar a Render
  # ================================
  deploy-render:
    name: 🚀 Desplegar en Render
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Llamar a la API de Render para activar Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\": false}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys

      - name: 🎉 Confirmación
        run: echo "Deploy solicitado con éxito a Render 🚀"
